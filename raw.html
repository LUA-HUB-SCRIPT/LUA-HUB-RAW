<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Luau Script</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
<script>
    function base64ToUtf8(str) {
        try {
            const binString = atob(str);
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        } catch (e) {
            return "-- Error: Gagal menguraikan kode Base64!";
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const encodedCode = urlParams.get('code');

    if (encodedCode) {
        const decodedLua = base64ToUtf8(encodedCode);
        document.body.textContent = decodedLua;
    } else {
        document.body.textContent = "-- Error 404: Tidak ada parameter kode yang diberikan!";
    }
</script>
</body>
</html>
